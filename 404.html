<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — DevNexus</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta property="og:title" content="404 — Page Not Found | DevNexus" />
  <link rel="canonical" href="https://nexus.smart.sd/404.html" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon.png" />
  <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <style>
    .page-404 { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
    .page-404 h1 { font-size: clamp(4rem, 15vw, 10rem); font-weight: 900; line-height: 1; margin-bottom: 0.5rem; }
    .page-404 h2 { margin-bottom: 1rem; }
    .page-404 p { color: var(--text-secondary); margin-bottom: 2rem; font-size: var(--font-size-lg); }
    .error-code { background: var(--color-primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  </style>
</head>
<body>
  <div class="page-404">
    <div>
      <h1 class="error-code">404</h1>
      <h2 data-i18n="404.title">Page Not Found</h2>
      <p data-i18n="404.desc">Oops! The page you are looking for does not exist or has been moved.</p>
      <div style="display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;">
        <a href="/" class="btn btn-primary btn-lg" data-i18n="404.btn">Go Home</a>
        <a href="/docs/" class="btn btn-secondary btn-lg" data-i18n="nav.docs">Documentation</a>
      </div>
    </div>
  </div>
  <script src="/assets/js/main.js"></script>
</body>
</html>
